<div class="login-wrapper">
  <div class="login-box">
    <h2>Login</h2>

    <input type="text" [(ngModel)]="loginObj.username" placeholder="Username">
    <input type="password" [(ngModel)]="loginObj.password" placeholder="Password">

    <button 
      (click)="onLogin()" 
      [disabled]="!loginObj.username || !loginObj.password">
      Login
    </button>
  </div>
</div>
